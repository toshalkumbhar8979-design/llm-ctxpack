[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxpack"
version = "0.1.0"
description = "Pack the most important text into a fixed LLM context-window token budget."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ctxpack contributors" }]
keywords = ["llm", "ai", "context-window", "rag", "tokens", "prompt-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/example/ctxpack"

[project.scripts]
ctxpack = "ctxpack.cli:main"

[tool.setuptools.packages.find]
include = ["ctxpack*"]
